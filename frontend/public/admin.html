
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA | Admin Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d19;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 5%;background:#101a2c;border-bottom:1px solid #26334a}
header h2{margin:0;color:#65aaff}
main{max-width:1100px;margin:35px auto;padding:0 20px}
h1{font-size:30px}
.panel{background:#111d30;padding:24px;border:1px solid #263750;border-radius:14px;margin:22px 0}
input,textarea{width:100%;padding:13px;margin:8px 0 15px;background:#080d19;color:white;border:1px solid #34445e;border-radius:7px}
textarea{min-height:110px;resize:vertical}
button{padding:11px 17px;border:0;border-radius:7px;background:#347fe5;color:white;cursor:pointer;margin:4px}
button.delete{background:#c43d4d}
.post{padding:17px 0;border-bottom:1px solid #34445e}
.post h3{margin:5px 0}
.muted{color:#aab8ca}
#status{color:#77dba0}
</style>
</head>
<body>
<header><h2>NEXORA ADMIN</h2></header>
<main>
<h1>Blog Management</h1>
<p class="muted">Create, edit and manage your blog articles.</p>
<div class="panel">
<h2 id="formTitle">Create New Article</h2>
<form id="blogForm">
<input id="title" placeholder="Article Title" required>
<input id="category" placeholder="Category" value="General">
<textarea id="excerpt" placeholder="Short Description" required></textarea>
<textarea id="content" placeholder="Full Article Content" required></textarea>
<button type="submit" id="submitBtn">Publish Article</button>
<button type="button" onclick="resetForm()">Cancel</button>
</form>
<p id="status"></p>
</div>
<div class="panel">
<h2>Published Articles</h2>
<div id="posts">Loading articles...</div>
</div>
</main>
<script>
const API = "http://localhost:5001/api/blogs";
let editingId = null;

const $ = id => document.getElementById(id);

function escapeHTML(value="") {
 return String(value).replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function message(text) {
 $("status").textContent = text;
}

async function loadPosts() {
 try {
  const response = await fetch(API);
  if (!response.ok) throw new Error("Could not load articles");
  const posts = await response.json();
  $("posts").innerHTML = posts.length ? posts.map(post => `
   <div class="post">
    <h3>${escapeHTML(post.title)}</h3>
    <p class="muted">${escapeHTML(post.category)} · ${escapeHTML(post.excerpt)}</p>
    <button onclick="editPost('${post._id}')">Edit</button>
    <button class="delete" onclick="deletePost('${post._id}')">Delete</button>
   </div>
  `).join("") : "<p class='muted'>No articles published yet.</p>";
 } catch(error) {
  $("posts").textContent = "Unable to connect to Blog API. Check that backend is running on port 5001.";
 }
}

async function submitForm(event) {
 event.preventDefault();
 const data = {
  title: $("title").value.trim(),
  category: $("category").value.trim() || "General",
  excerpt: $("excerpt").value.trim(),
  content: $("content").value.trim()
 };
 try {
  const response = await fetch(editingId ? `${API}/${editingId}` : API, {
   method: editingId ? "PUT" : "POST",
   headers: {"Content-Type":"application/json"},
   body: JSON.stringify(data)
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result.message || "Save failed");
  message(editingId ? "Article updated successfully." : "Article published successfully.");
  resetForm();
  loadPosts();
 } catch(error) {
  message(error.message);
 }
}

async function editPost(id) {
 try {
  const response = await fetch(API);
  const posts = await response.json();
  const post = posts.find(p => p._id === id);
  if (!post) return;
  editingId = id;
  $("title").value = post.title || "";
  $("category").value = post.category || "General";
  $("excerpt").value = post.excerpt || "";
  $("content").value = post.content || "";
  $("formTitle").textContent = "Edit Article";
  $("submitBtn").textContent = "Update Article";
  window.scrollTo({top:0,behavior:"smooth"});
 } catch(error) {
  message("Could not load article.");
 }
}

async function deletePost(id) {
 if (!confirm("Are you sure you want to delete this article?")) return;
 try {
  const response = await fetch(`${API}/${id}`, {method:"DELETE"});
  if (!response.ok) throw new Error("Delete failed");
  message("Article deleted successfully.");
  loadPosts();
 } catch(error) {
  message(error.message);
 }
}

function resetForm() {
 editingId = null;
 $("blogForm").reset();
 $("category").value = "General";
 $("formTitle").textContent = "Create New Article";
 $("submitBtn").textContent = "Publish Article";
}

$("blogForm").addEventListener("submit", submitForm);
loadPosts();
</script>
</body>
</html>
